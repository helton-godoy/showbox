name: Showbox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    runs-on: ubuntu-24.04
    permissions:
      checks: write # para o Trunk registrar anotações no check run
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          check-mode: all
          cache: false

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Qt 6 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential cmake ninja-build git python3 shellcheck \
            qt6-base-dev qt6-charts-dev qt6-svg-dev
      - name: Validar suporte Bash
        run: shellcheck -x -s bash shell/lib/runtime.sh examples/hello-world/run.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Validate install tree
        run: |
          rm -rf /tmp/install
          DESTDIR=/tmp/install cmake --install build --prefix /usr
          test -x /tmp/install/usr/bin/showbox
          test -x /tmp/install/usr/bin/showbox-studio
          test -f /tmp/install/usr/share/applications/showbox.desktop
          test -f /tmp/install/usr/share/applications/showbox-studio.desktop
          test -f /tmp/install/usr/share/icons/hicolor/scalable/apps/showbox-studio.svg
      - name: Unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: CLI contract smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/bin/showbox --version
          build/bin/showbox --help | grep -q "stdin"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: showbox-linux-amd64
          path: |
            build/bin/showbox
            build/bin/showbox-studio

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential cmake ninja-build git python3 shellcheck \
            qt6-base-dev qt6-charts-dev qt6-svg-dev
      - name: Build with ASan and UBSan
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel 2
      - env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
        run: ctest --test-dir build --output-on-failure
