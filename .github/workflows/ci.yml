name: Showbox CI

on:
  push:
    branches: [main, develop, "integration/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: CLI contract smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/bin/showbox --version
          build/bin/showbox --help | grep -q "stdin"
      - uses: actions/upload-artifact@v4
        with:
          name: showbox-linux-amd64
          path: build/bin/showbox

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev
      - name: Build with ASan and UBSan
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel
      - env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
