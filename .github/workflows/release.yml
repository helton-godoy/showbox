name: Showbox Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker

jobs:
  deb-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build DEB (Ubuntu 24.04)
        run: bash packaging/deb/start-pkg-deb.sh ubuntu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debs-ubuntu
          path: dist/ubuntu/*.deb

  deb-debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build DEB (Debian Trixie)
        run: bash packaging/deb/start-pkg-deb.sh debian
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debs-debian
          path: dist/debian/*.deb

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build RPM (Fedora)
        run: bash packaging/rpm/start-pkg-rpm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpms
          path: dist/*.rpm

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build AppImage (Studio)
        run: bash packaging/appimage/start-pkg-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage
          path: dist/*.AppImage

  install-smoke:
    needs: [deb-ubuntu, deb-debian, rpm, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Smoke DEB Ubuntu
        run: bash tests/installation/install_smoke.sh deb artifacts/debs-ubuntu ubuntu
      - name: Smoke DEB Debian
        run: bash tests/installation/install_smoke.sh deb artifacts/debs-debian debian
      - name: Smoke RPM Fedora
        run: bash tests/installation/install_smoke.sh rpm artifacts/rpms
      - name: Smoke AppImage Studio
        run: >-
          bash tests/installation/install_smoke.sh appimage
          artifacts/appimage/ShowBox-Studio-1.0.0-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [install-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Remover pacotes de depuração
        run: |
          find dist -type f \( -name '*debuginfo*' -o -name '*debugsource*' \) -delete
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShowBox ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
