name: Showbox Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker

jobs:
  deb-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build DEB (Ubuntu 24.04)
        run: bash packaging/deb/start-pkg-deb.sh ubuntu
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debs-ubuntu
          path: dist/ubuntu/*.deb

  deb-debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build DEB (Debian Trixie)
        run: bash packaging/deb/start-pkg-deb.sh debian
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debs-debian
          path: dist/debian/*.deb

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build RPM (Fedora)
        run: bash packaging/rpm/start-pkg-rpm.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rpms
          path: dist/*.rpm

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build AppImage (Studio)
        run: bash packaging/appimage/start-pkg-appimage.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: appimage
          path: dist/*.AppImage

  install-smoke:
    needs: [deb-ubuntu, deb-debian, rpm, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
      - name: Ler versão única
        id: version
        run: |
          v="$(cat VERSION)"
          echo "app=${v}" >> "$GITHUB_OUTPUT"
          echo "versão ${v}"
      - name: Smoke DEB Ubuntu
        run: bash tests/installation/install_smoke.sh deb artifacts/debs-ubuntu ubuntu
      - name: Smoke DEB Debian
        run: bash tests/installation/install_smoke.sh deb artifacts/debs-debian debian
      - name: Smoke RPM Fedora
        run: bash tests/installation/install_smoke.sh rpm artifacts/rpms
      - name: Smoke AppImage Studio
        run: >-
          bash tests/installation/install_smoke.sh appimage
          artifacts/appimage/ShowBox-Studio-${{ steps.version.outputs.app }}-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [install-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
      - name: Remover pacotes de depuração
        run: |
          find dist -type f \( -name '*debuginfo*' -o -name '*debugsource*' -o -name '*dbgsym*' \) -delete
      - name: Validar tag vs versão única e classificar a release
        id: meta
        run: |
          v="$(cat VERSION)"
          if [[ "v${v}" != "${{ github.ref_name }}" ]]; then
            echo "A tag ${{ github.ref_name }} não corresponde ao VERSION (${v})." >&2
            exit 1
          fi
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Garantir basenames únicos antes do upload
        run: |
          count="$(cd dist && find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | wc -l)"
          (( count > 0 )) || {
            echo "Nenhum artefato para publicar." >&2
            exit 1
          }
          dups="$(cd dist && find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec basename {} \; | sort | uniq -d)"
          if [[ -n ${dups} ]]; then
            echo "Basenames duplicados encontrados:" >&2
            echo "${dups}" >&2
            exit 1
          fi
          echo "Artefatos a publicar (${count}):"
          (cd dist && find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec basename {} \; | sort)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShowBox ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
