app-id: io.github.showbox
runtime: org.kde.Platform
runtime-version: "6.6"
sdk: org.kde.Sdk
command: showbox

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: showbox
    buildsystem: cmake-ninja
    config-opts:
      - -DSHOWBOX_BUILD_STUDIO=OFF
    sources:
      - type: dir
        path: ../..
    post-install:
      - install -D -m 644 packaging/flatpak/io.github.showbox.desktop /app/share/applications/io.github.showbox.desktop
      - install -D -m 644 packaging/flatpak/io.github.showbox.metainfo.xml /app/share/metainfo/io.github.showbox.metainfo.xml
